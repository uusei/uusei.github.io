<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/app.css?v=3.0.3">
  <title>云端相册</title>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <!-- 全局轻量通知提示 -->
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- Service Worker 应用版本更新横幅 -->
  <div id="update-banner" class="update-banner" hidden role="alert">
    <div class="update-banner-content">
      <span class="update-banner-icon">🚀</span>
      <span class="update-banner-text">发现新版本应用，更新即可体验最新功能！</span>
    </div>
    <div class="update-banner-actions">
      <button id="btn-update-now" class="btn btn-sm btn-primary" type="button">立即更新</button>
      <button id="btn-update-dismiss" class="btn btn-sm btn-secondary" type="button" aria-label="关闭更新提示">忽略</button>
    </div>
  </div>
  <input id="file-input" type="file" accept="image/*" multiple hidden>
  <script type="module" src="./js/app.js?v=3.0.3"></script>
</body>
</html>
